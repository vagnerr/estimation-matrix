<!DOCTYPE html>
<html lang="en-gb">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <title>Estimation Matrix: Lobby</title>
  <style>
    body {
      padding: 0;
      margin: 0;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.2.0/p5.min.js" integrity="sha512-b/htz6gIyFi3dwSoZ0Uv3cuv3Ony7EeKkacgrcVg8CMzu90n777qveu0PBcbZUA7TzyENGtU+qZRuFAkfqgyoQ==" crossorigin="anonymous"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-ygbV9kiqUc6oa4msXn9868pTtWMgiQaeYH7/t7LECLbyPA2x65Kgf80OJFdroafW" crossorigin="anonymous"></script>
  <script src="/common.js"></script>
  <script src="/lobby.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-fork-ribbon-css/0.2.3/gh-fork-ribbon.min.css" integrity="sha384-R1YHNrXeEniyCWFPaeU6FPn6fbr866YytGK2aZ3vVF3zQKIgUza8LYJ0HdOZ3FJI" crossorigin="anonymous">
  <link href="sticky-footer.css" rel="stylesheet">
</head>
<body>
  <main role="main" class="container">
  <div class="container-fluid banner-header" >
  <a class="github-fork-ribbon" href="https://github.com/vagnerr/estimation-matrix" data-ribbon="Fork me on GitHub" title="Fork me on GitHub">Fork me on GitHub</a>

    <h1>Estimation Matrix: Lobby</h1>
  </div>
  <div class="container">
    <div class="row">
      <div class="col-md-9 col-lg-7">
        <div class="row">
            <div class="col-md-6">
              Name: <input class="form-control" placeholder="Name" id='userName' type='text' size='20' oninput="checkButtons()"/>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">
              Room ID:<input class="form-control" placeholder="Room" id='roomId' type='text' size='20'  oninput="checkButtons()"/>
            </div>
        </div>
        <div class="col-md-6">
          <button id="joinBtn" class="btn btn-secondary" onClick="redirectToRoom()" disabled>Join Room</button>
          <button id="newRoomBtn" class="btn btn-secondary" onClick="createNewRoom()" disabled>Create New Room</button>
        </div>
      </div>

    </div>
  </div>
</main>
  <footer class="footer">
    <div class="container">
      <span class="text-muted">Version: <span id='version-include'></span></span>
    </div>
  </footer>
  <script>includeVersion();setUserName();checkButtons()</script>
</body>

</html>
